<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>楽天 × Keepa 照合ツール</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>

<body>

<h2>楽天API設定</h2>

アプリID:  
<input id="rakutenAppId" value="a38ecc5b-5a90-4eb9-b4f8-e714ba84eefd"><br>

AccessKey:  
<input id="rakutenAccessKey" value="pk_oRPj9UEOAjvjnUtRwKwaje85mgY98Nzo7rzvGf7sQRj"><br>

1ページあたり件数（hits）  
<input id="rakutenHits" value="30"><br>

最大ページ数  
<input id="rakutenMaxPage" value="100"><br>

検索キーワード  
<input id="searchKeywordInput" value="ナイキ シューズ"><br><br>

<button id="runRakutenApiBtn">楽天APIで検索実行</button>
<div id="rakutenStatus"></div>

<hr>

<h2>Keepa CSV入力</h2>
<input type="file" id="keepaCsvInput">
<button id="clearKeepaBtn">Keepa CSVクリア</button>

<div id="keepaStatus"></div>

<hr>

<h2>楽天 × Keepa 照合</h2>
<button id="runMatchBtn">照合開始</button>

<div id="matchStatus"></div>
<div id="matchSummary"></div>

<hr>

<h2>照合結果</h2>

<table id="resultTable" border="1">
<thead>
<tr>
  <th>ショップ</th>
  <th>商品名</th>
  <th>型番</th>
  <th>楽天URL</th>
  <th>単価</th>
  <th>ASIN</th>
  <th>AmazonURL</th>
  <th>出品価格</th>
  <th>入金予定</th>
</tr>
</thead>
<tbody></tbody>
</table>

<hr>

<button id="exportExcelBtn">ExcelテンプレートCSV出力</button>
<button id="exportRawCsvBtn">結果のみCSV出力</button>

<hr>

<h2>ログ</h2>
<textarea id="logArea" rows="20" cols="120"></textarea>

<script src="app.js"></script>
</body>
</html>
